name: Build Mini Flip community preview 2
on:
  push:
    branches: [mini-flip-community-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/mini_flip_regression.py
      - run: python3 tests/mini_flip_stability.py
      - run: python3 tests/mini_flip_community.py
      - run: python3 tests/mini_flip_pocket.py
      - run: python3 tests/onion_community_compatibility.py
      - run: sh -n static/build/.tmp_update/runtime.sh
  release:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: robcodedev/onionos-mainui-opensource
          ref: 7212b750d738c9f767e50c0d9d16dbc51322f068
          path: _open_mainui
          persist-credentials: false
      - name: Build pinned Open MainUI
        shell: bash
        run: |
          source /root/.bashrc
          make -C _open_mainui device ONION_ROOT="$GITHUB_WORKSPACE"
          cp _open_mainui/build/onion/MainUI static/build/.tmp_update/bin/MainUI-open
          mkdir -p static/build/.tmp_update/open-mainui
          cp _open_mainui/LICENSE _open_mainui/THIRD_PARTY_NOTICES.md static/build/.tmp_update/open-mainui/
          echo 'Corresponding source: https://github.com/robcodedev/onionos-mainui-opensource/tree/7212b750d738c9f767e50c0d9d16dbc51322f068' > static/build/.tmp_update/open-mainui/SOURCE.txt
      - name: Build patched installer
        shell: bash
        run: |
          source /root/.bashrc
          make release VERSION_OVERRIDE=4.5-dev-miniflip-community2
      - name: Validate installer
        shell: bash
        run: |
          7z t release/Onion-v4.5-dev-miniflip-community2.zip
          7z t dist/miyoo/app/.tmp_update/onion.pak
          7z t dist/RetroArch/retroarch.pak
          readelf -h build/.tmp_update/bin/keymon | grep 'Machine:.*ARM'
          readelf -h build/.tmp_update/bin/MainUI-open | grep 'Machine:.*ARM'
          test -x build/.tmp_update/bin/fbmode
          test -x build/App/UseOpenMainUI/launch.sh
          test ! -e build/.tmp_update/config/.openMainUI
          test -s dist/.tmp_update/updater
          test -s dist/miyoo/app/.tmp_update/install.sh
          cd release
          sha256sum Onion-v4.5-dev-miniflip-community2.zip > SHA256SUMS.txt
          {
            echo 'Unofficial Mini Flip community preview 2; hardware validation pending.'
            echo 'Open MainUI: 7212b750d738c9f767e50c0d9d16dbc51322f068 (v1.0.6)'
            echo 'Display donor: OnionUI PR1940, 5b95c76854d1b2fed50b6441e2e41da2c7274172; with local bounds/timer hardening'
            echo 'Open MainUI host evaluation: https://github.com/bluedolphins420/Onion/actions/runs/38016986895'
            echo 'Upstream base: 2bab767e4a17b1b489f02c9fb6af8dde310d4c3e'
            echo "Patched source commit: $GITHUB_SHA"
            echo "Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Onion-v4.5-dev-miniflip-community2-installer
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
